[package]
name = "project-guru"
version = "1.0.0"
description = "Project Guru — interactive Gantt chart project management"
authors = ["Project Guru"]
edition = "2021"

[lib]
name = "project_guru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
